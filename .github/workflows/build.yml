name: Build Mia APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use the same signing key every build
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Write the Mia project files
        run: |
          mkdir -p .
          cat > settings.gradle.kts <<'MIAEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Mia"
          include(":app")
          MIAEOF
          mkdir -p .
          cat > build.gradle.kts <<'MIAEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          MIAEOF
          mkdir -p .
          cat > gradle.properties <<'MIAEOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          MIAEOF
          mkdir -p app
          cat > app/build.gradle.kts <<'MIAEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.umar.mia"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.umar.mia"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "0.2"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          MIAEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'MIAEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.INTERNET" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:label="Mia"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:windowSoftInputMode="adjustResize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          MIAEOF
          mkdir -p app/src/main/java/com/umar/mia
          cat > app/src/main/java/com/umar/mia/MainActivity.kt <<'MIAEOF'
          package com.umar.mia

          import android.Manifest
          import android.animation.ValueAnimator
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.ContactsContract
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.text.InputType
          import android.util.Log
          import android.view.Gravity
          import android.view.View
          import android.view.animation.LinearInterpolator
          import android.widget.Button
          import android.widget.EditText
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale

          class OrbView(context: Context) : View(context) {

              enum class Mode { IDLE, LISTENING, THINKING, SPEAKING }

              var mode: Mode = Mode.IDLE
                  set(value) {
                      field = value
                      invalidate()
                  }

              var level: Float = 0f

              private var phase = 0f
              private var smooth = 0f
              private val density = context.resources.displayMetrics.density
              private val corePaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val glowPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val ringPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val arcPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val arcRect = RectF()

              private val animator = ValueAnimator.ofFloat(0f, 1f)

              init {
                  ringPaint.style = Paint.Style.STROKE
                  ringPaint.strokeWidth = 3f * density
                  arcPaint.style = Paint.Style.STROKE
                  arcPaint.strokeCap = Paint.Cap.ROUND
                  arcPaint.strokeWidth = 5f * density
                  animator.duration = 2400
                  animator.repeatCount = ValueAnimator.INFINITE
                  animator.interpolator = LinearInterpolator()
                  animator.addUpdateListener {
                      phase = it.animatedValue as Float
                      invalidate()
                  }
              }

              private fun colorFor(): Int = when (mode) {
                  Mode.IDLE -> Color.parseColor("#7C4DFF")
                  Mode.LISTENING -> Color.parseColor("#00E5FF")
                  Mode.THINKING -> Color.parseColor("#FFB300")
                  Mode.SPEAKING -> Color.parseColor("#00E676")
              }

              private fun withAlpha(c: Int, a: Int): Int {
                  val alpha = a.coerceIn(0, 255)
                  return Color.argb(alpha, Color.red(c), Color.green(c), Color.blue(c))
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  animator.start()
              }

              override fun onDetachedFromWindow() {
                  animator.cancel()
                  super.onDetachedFromWindow()
              }

              override fun onDraw(canvas: Canvas) {
                  val cx = width / 2f
                  val cy = height / 2f
                  val base = minOf(width, height) * 0.2f
                  val color = colorFor()
                  val twoPi = (2.0 * Math.PI).toFloat()

                  smooth += (level - smooth) * 0.25f

                  val wave = Math.sin((phase * twoPi).toDouble()).toFloat()
                  val wave2 = Math.sin((phase * twoPi * 2f).toDouble()).toFloat()
                  val wave3 = Math.abs(Math.sin((phase * twoPi * 3f).toDouble())).toFloat()

                  val scale = when (mode) {
                      Mode.IDLE -> 1f + 0.04f * wave
                      Mode.LISTENING -> 1f + 0.05f * wave2 + 0.18f * smooth
                      Mode.THINKING -> 0.95f + 0.03f * wave2
                      Mode.SPEAKING -> 1f + 0.14f * wave3
                  }
                  val r = base * scale

                  // soft glow
                  glowPaint.shader = RadialGradient(
                      cx, cy, r * 2.8f,
                      intArrayOf(withAlpha(color, 130), withAlpha(color, 0)),
                      null,
                      Shader.TileMode.CLAMP
                  )
                  canvas.drawCircle(cx, cy, r * 2.8f, glowPaint)

                  // pulse rings
                  if (mode == Mode.LISTENING || mode == Mode.SPEAKING) {
                      for (i in 0 until 3) {
                          val p = (phase + i / 3f) % 1f
                          ringPaint.color = withAlpha(color, ((1f - p) * 160f).toInt())
                          canvas.drawCircle(cx, cy, r * (1f + 0.9f * p), ringPaint)
                      }
                  } else if (mode == Mode.IDLE) {
                      val p = phase
                      ringPaint.color = withAlpha(color, ((1f - p) * 70f).toInt())
                      canvas.drawCircle(cx, cy, r * (1f + 0.6f * p), ringPaint)
                  }

                  // thinking spinner
                  if (mode == Mode.THINKING) {
                      arcPaint.color = color
                      arcRect.set(cx - r * 1.55f, cy - r * 1.55f, cx + r * 1.55f, cy + r * 1.55f)
                      canvas.drawArc(arcRect, phase * 360f, 110f, false, arcPaint)
                      canvas.drawArc(arcRect, phase * 360f + 180f, 110f, false, arcPaint)
                  }

                  // core
                  val dark = Color.argb(
                      255,
                      Color.red(color) / 3,
                      Color.green(color) / 3,
                      Color.blue(color) / 3
                  )
                  corePaint.shader = RadialGradient(
                      cx - r * 0.3f, cy - r * 0.3f, r * 1.4f,
                      intArrayOf(Color.WHITE, color, dark),
                      floatArrayOf(0f, 0.45f, 1f),
                      Shader.TileMode.CLAMP
                  )
                  canvas.drawCircle(cx, cy, r, corePaint)
              }
          }

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private lateinit var button: Button
              private lateinit var orb: OrbView
              private lateinit var feed: LinearLayout
              private lateinit var keyBox: EditText
              private lateinit var modelBox: EditText
              private lateinit var savedText: TextView
              private lateinit var savedRow: LinearLayout
              private var changingKey = false
              private var recognizer: SpeechRecognizer? = null
              private var tts: TextToSpeech? = null
              private var listening = false
              private var paused = false
              private var busy = false
              private val handler = Handler(Looper.getMainLooper())
              private val prefs by lazy { getSharedPreferences("mia", MODE_PRIVATE) }
              private val defaultModel = "gpt-6-luna"

              private val systemPrompt = """You are Mia, a voice assistant living inside the user's Android phone. Reply with ONLY one JSON object and nothing else. Choose one action:
          {"action":"call","name":"contact name"}
          {"action":"open_app","name":"app name"}
          {"action":"flashlight","on":true}
          {"action":"volume","direction":"up"}
          (direction is up, down or mute)
          {"action":"say","text":"short spoken answer"}
          For questions or chat, use say with an answer of at most 3 short sentences. If you are unsure what the user wants, use say and ask a short question."""

              private val needed = arrayOf(
                  Manifest.permission.RECORD_AUDIO,
                  Manifest.permission.READ_CONTACTS,
                  Manifest.permission.CALL_PHONE
              )

              private val listener = object : RecognitionListener {
                  override fun onResults(results: Bundle?) {
                      val text = results
                          ?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          ?.firstOrNull()
                      if (text != null) handleSpeech(text)
                      again()
                  }
                  override fun onError(error: Int) {
                      if (!paused && !busy && error != 6 && error != 7) {
                          setStatus("Listening...\n(mic code $error)")
                      }
                      again()
                  }
                  override fun onRmsChanged(rmsdB: Float) {
                      orb.level = ((rmsdB + 2f) / 12f).coerceIn(0f, 1f)
                  }
                  override fun onReadyForSpeech(params: Bundle?) {}
                  override fun onBeginningOfSpeech() {}
                  override fun onBufferReceived(buffer: ByteArray?) {}
                  override fun onEndOfSpeech() {}
                  override fun onPartialResults(partialResults: Bundle?) {}
                  override fun onEvent(eventType: Int, params: Bundle?) {}
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun pill(color: Int, radiusDp: Int): GradientDrawable {
                  val d = GradientDrawable()
                  d.setColor(color)
                  d.cornerRadius = dp(radiusDp).toFloat()
                  return d
              }

              private fun params(top: Int): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )
                  p.topMargin = dp(top)
                  return p
              }

              private fun chipParams(): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT,
                      dp(40)
                  )
                  p.rightMargin = dp(8)
                  return p
              }

              private fun chip(label: String, action: () -> Unit): Button {
                  val b = Button(this)
                  b.text = label
                  b.isAllCaps = false
                  b.textSize = 13f
                  b.setTextColor(Color.WHITE)
                  b.background = pill(Color.parseColor("#1E1E3A"), 20)
                  b.minHeight = 0
                  b.minimumHeight = 0
                  b.setPadding(dp(16), 0, dp(16), 0)
                  b.setOnClickListener { action() }
                  return b
              }

              private fun styleInput(e: EditText) {
                  e.setTextColor(Color.WHITE)
                  e.setHintTextColor(Color.parseColor("#6E7390"))
                  e.background = pill(Color.parseColor("#1E1E3A"), 12)
                  e.setPadding(dp(14), dp(10), dp(14), dp(10))
                  e.setSingleLine(true)
              }

              private fun smallButton(label: String, color: String): Button {
                  val b = Button(this)
                  b.text = label
                  b.isAllCaps = false
                  b.textSize = 13f
                  b.setTextColor(Color.WHITE)
                  b.background = pill(Color.parseColor(color), 12)
                  b.minHeight = 0
                  b.minimumHeight = 0
                  b.setPadding(dp(16), dp(8), dp(16), dp(8))
                  return b
              }

              private fun styleButton() {
                  button.text = if (listening) "Stop Mia" else "Start Mia"
                  button.background = pill(Color.parseColor(if (listening) "#FF5252" else "#7C4DFF"), 28)
              }

              private fun setStatus(text: String) {
                  status.text = text
              }

              private fun addFeed(who: String, text: String) {
                  val tv = TextView(this)
                  tv.text = who + ": " + text
                  tv.textSize = 14f
                  tv.setTextColor(
                      if (who == "You") Color.parseColor("#9AA0B4") else Color.parseColor("#E8EAF6")
                  )
                  tv.setPadding(0, dp(4), 0, dp(4))
                  feed.addView(tv, 1)
                  while (feed.childCount > 8) feed.removeViewAt(feed.childCount - 1)
              }

              private fun refreshKeyUi() {
                  val key = prefs.getString("apikey", "") ?: ""
                  val has = key.isNotEmpty()
                  val showInput = !has || changingKey
                  keyBox.visibility = if (showInput) View.VISIBLE else View.GONE
                  savedText.visibility = if (showInput) View.GONE else View.VISIBLE
                  savedRow.visibility = if (showInput) View.GONE else View.VISIBLE
                  savedText.text = if (has) "API key saved \u2713  (ends with " + key.takeLast(4) + ")" else ""
                  keyBox.hint = if (has) "Paste your new OpenAI API key" else "Paste your OpenAI API key"
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#0B0B14")
                  window.navigationBarColor = Color.parseColor("#0B0B14")

                  val oldHandler = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { t, e ->
                      prefs.edit().putString("crash", Log.getStackTraceString(e)).commit()
                      oldHandler?.uncaughtException(t, e)
                  }

                  tts = TextToSpeech(this) { s ->
                      if (s == TextToSpeech.SUCCESS) {
                          tts?.language = Locale.US
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) {}
                              override fun onDone(utteranceId: String?) {
                                  runOnUiThread { resumeNow() }
                              }
                              override fun onError(utteranceId: String?) {
                                  runOnUiThread { resumeNow() }
                              }
                          })
                      }
                  }

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Color.parseColor("#0B0B14"))
                  root.setPadding(dp(20), dp(28), dp(20), dp(28))

                  val title = TextView(this)
                  title.text = "Mia"
                  title.textSize = 34f
                  title.setTextColor(Color.WHITE)
                  title.gravity = Gravity.CENTER
                  title.setTypeface(title.typeface, Typeface.BOLD)

                  val subtitle = TextView(this)
                  subtitle.text = "Your voice machine"
                  subtitle.textSize = 14f
                  subtitle.setTextColor(Color.parseColor("#9AA0B4"))
                  subtitle.gravity = Gravity.CENTER

                  orb = OrbView(this)

                  status = TextView(this)
                  status.text = "Hi, I'm Mia.\nTap Start Mia, then say:\n\"Hey Mia, what is photosynthesis?\""
                  status.textSize = 17f
                  status.setTextColor(Color.WHITE)
                  status.gravity = Gravity.CENTER

                  button = Button(this)
                  button.isAllCaps = false
                  button.textSize = 18f
                  button.setTextColor(Color.WHITE)
                  button.setOnClickListener {
                      if (listening) stopMia() else startMia()
                  }
                  styleButton()

                  val chipsScroll = HorizontalScrollView(this)
                  chipsScroll.isHorizontalScrollBarEnabled = false
                  val chipsRow = LinearLayout(this)
                  chipsRow.orientation = LinearLayout.HORIZONTAL
                  chipsRow.addView(chip("Flashlight on") {
                      addFeed("You", "Flashlight on")
                      flashlight(true)
                  }, chipParams())
                  chipsRow.addView(chip("Flashlight off") {
                      addFeed("You", "Flashlight off")
                      flashlight(false)
                  }, chipParams())
                  chipsRow.addView(chip("Volume up") {
                      addFeed("You", "Volume up")
                      volume("up")
                  }, chipParams())
                  chipsRow.addView(chip("Volume down") {
                      addFeed("You", "Volume down")
                      volume("down")
                  }, chipParams())
                  chipsScroll.addView(chipsRow)

                  // activity feed
                  feed = LinearLayout(this)
                  feed.orientation = LinearLayout.VERTICAL
                  feed.background = pill(Color.parseColor("#14142A"), 16)
                  feed.setPadding(dp(16), dp(14), dp(16), dp(14))
                  val feedLabel = TextView(this)
                  feedLabel.text = "Activity"
                  feedLabel.textSize = 13f
                  feedLabel.setTextColor(Color.parseColor("#7C4DFF"))
                  feed.addView(feedLabel)
                  addFeed("Mia", "Ready when you are. Say \"Hey Mia\" and give me a command.")

                  // settings card
                  val card = LinearLayout(this)
                  card.orientation = LinearLayout.VERTICAL
                  card.background = pill(Color.parseColor("#14142A"), 16)
                  card.setPadding(dp(16), dp(14), dp(16), dp(14))

                  val label = TextView(this)
                  label.text = "Settings (OpenAI)"
                  label.textSize = 13f
                  label.setTextColor(Color.parseColor("#7C4DFF"))

                  keyBox = EditText(this)
                  keyBox.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  styleInput(keyBox)

                  savedText = TextView(this)
                  savedText.textSize = 15f
                  savedText.setTextColor(Color.parseColor("#00E676"))

                  savedRow = LinearLayout(this)
                  savedRow.orientation = LinearLayout.HORIZONTAL
                  val changeBtn = smallButton("Change key", "#1E1E3A")
                  changeBtn.setOnClickListener {
                      changingKey = true
                      refreshKeyUi()
                  }
                  val removeBtn = smallButton("Remove key", "#5A1F2B")
                  removeBtn.setOnClickListener {
                      prefs.edit().remove("apikey").apply()
                      changingKey = false
                      refreshKeyUi()
                      setStatus("API key removed.")
                  }
                  savedRow.addView(changeBtn, chipParams())
                  savedRow.addView(removeBtn, chipParams())

                  modelBox = EditText(this)
                  modelBox.hint = "Model name"
                  modelBox.setText(prefs.getString("model", defaultModel))
                  styleInput(modelBox)

                  val saveBtn = Button(this)
                  saveBtn.text = "Save"
                  saveBtn.isAllCaps = false
                  saveBtn.setTextColor(Color.WHITE)
                  saveBtn.background = pill(Color.parseColor("#7C4DFF"), 12)
                  saveBtn.setOnClickListener {
                      val key = keyBox.text.toString().trim()
                      val model = modelBox.text.toString().trim().ifEmpty { defaultModel }
                      val edit = prefs.edit()
                      if (key.isNotEmpty()) edit.putString("apikey", key)
                      edit.putString("model", model)
                      edit.apply()
                      keyBox.setText("")
                      changingKey = false
                      refreshKeyUi()
                      val has = !prefs.getString("apikey", "").isNullOrEmpty()
                      setStatus(
                          if (has) "Saved. Mia's brain is ready.\nTap Start Mia."
                          else "Model saved, but there is no API key yet."
                      )
                  }

                  card.addView(label)
                  card.addView(keyBox, params(10))
                  card.addView(savedText, params(10))
                  card.addView(savedRow, params(8))
                  card.addView(modelBox, params(10))
                  card.addView(saveBtn, params(12))

                  root.addView(title, params(0))
                  root.addView(subtitle, params(0))
                  root.addView(orb, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, dp(260)
                  ))
                  root.addView(status, params(0))
                  root.addView(button, params(18))
                  root.addView(chipsScroll, params(14))
                  root.addView(feed, params(18))
                  root.addView(card, params(14))

                  refreshKeyUi()

                  val crash = prefs.getString("crash", null)
                  if (crash != null) {
                      setStatus("Mia crashed last time. Screenshot this:\n\n" + crash.take(1200))
                      status.textSize = 12f
                      prefs.edit().remove("crash").apply()
                  }

                  val scroll = ScrollView(this)
                  scroll.isFillViewport = true
                  scroll.setBackgroundColor(Color.parseColor("#0B0B14"))
                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun startMia() {
                  val missing = needed.filter {
                      checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isNotEmpty()) {
                      requestPermissions(missing.toTypedArray(), 1)
                      return
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      setStatus("Speech recognition isn't available on this phone.")
                      return
                  }
                  listening = true
                  paused = false
                  busy = false
                  styleButton()
                  orb.mode = OrbView.Mode.LISTENING
                  setStatus("Listening...\nSay: \"Hey Mia, ...\"")
                  listen()
              }

              private fun stopMia() {
                  listening = false
                  paused = false
                  busy = false
                  handler.removeCallbacksAndMessages(null)
                  tts?.stop()
                  recognizer?.destroy()
                  recognizer = null
                  orb.level = 0f
                  orb.mode = OrbView.Mode.IDLE
                  styleButton()
                  setStatus("Mia is asleep.\nTap Start Mia to wake her.")
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (grantResults.isNotEmpty() &&
                      grantResults.all { it == PackageManager.PERMISSION_GRANTED }
                  ) {
                      startMia()
                  } else {
                      setStatus("I need the mic, contacts and phone permissions to work.")
                  }
              }

              private fun listen() {
                  if (!listening || paused) return
                  try {
                      val r = recognizer ?: SpeechRecognizer.createSpeechRecognizer(this).also {
                          it.setRecognitionListener(listener)
                          recognizer = it
                      }
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      intent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                      )
                      r.startListening(intent)
                  } catch (e: Exception) {
                      listening = false
                      orb.mode = OrbView.Mode.IDLE
                      styleButton()
                      setStatus("Error: $e")
                  }
              }

              private fun again() {
                  if (!listening) return
                  handler.postDelayed({ listen() }, 600)
              }

              private fun resumeNow() {
                  if (!paused) return
                  paused = false
                  if (listening) orb.mode = OrbView.Mode.LISTENING
                  again()
              }

              private fun say(text: String) {
                  setStatus("Mia: $text")
                  addFeed("Mia", text)
                  val t = tts
                  if (t == null || text.isBlank()) return
                  paused = true
                  orb.mode = OrbView.Mode.SPEAKING
                  recognizer?.cancel()
                  t.speak(text, TextToSpeech.QUEUE_FLUSH, null, "mia")
                  handler.postDelayed({ resumeNow() }, 3000L + text.length * 80L)
              }

              private fun handleSpeech(text: String) {
                  if (busy || paused) return
                  val lower = text.lowercase()
                  val match = Regex("\\b(mia|maya|mea|mya)\\b").find(lower)
                  if (match == null) {
                      setStatus("Listening...\n(heard: $text)")
                      return
                  }
                  val command = lower
                      .substring(match.range.last + 1)
                      .trim()
                      .trimStart(',', '.', ' ')
                  if (command.isBlank()) {
                      setStatus("Yes? Say: Hey Mia, and then what you want.")
                      return
                  }
                  addFeed("You", command)
                  if (command.startsWith("call ")) {
                      callContact(command.removePrefix("call ").trim())
                  } else {
                      askBrain(command)
                  }
              }

              private fun askBrain(command: String) {
                  val key = prefs.getString("apikey", "") ?: ""
                  val model = prefs.getString("model", defaultModel) ?: defaultModel
                  if (key.isBlank()) {
                      setStatus("I need your OpenAI key first.\nPaste it in Settings and tap Save.")
                      return
                  }
                  busy = true
                  orb.mode = OrbView.Mode.THINKING
                  setStatus("Thinking...\n($command)")
                  Thread {
                      val result = callOpenAI(key, model, command)
                      runOnUiThread {
                          busy = false
                          handleBrain(result)
                      }
                  }.start()
              }

              private fun callOpenAI(key: String, model: String, command: String): String {
                  try {
                      val body = JSONObject()
                      body.put("model", model)
                      val msgs = JSONArray()
                      msgs.put(JSONObject().put("role", "system").put("content", systemPrompt))
                      msgs.put(JSONObject().put("role", "user").put("content", command))
                      body.put("messages", msgs)

                      val conn = URL("https://api.openai.com/v1/chat/completions")
                          .openConnection() as HttpURLConnection
                      conn.requestMethod = "POST"
                      conn.connectTimeout = 15000
                      conn.readTimeout = 40000
                      conn.setRequestProperty("Content-Type", "application/json")
                      conn.setRequestProperty("Authorization", "Bearer " + key)
                      conn.doOutput = true
                      conn.outputStream.use { it.write(body.toString().toByteArray()) }

                      val code = conn.responseCode
                      val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                      val text = stream?.bufferedReader()?.use { it.readText() } ?: ""
                      if (code !in 200..299) return "ERR: HTTP $code $text"
                      return JSONObject(text)
                          .getJSONArray("choices")
                          .getJSONObject(0)
                          .getJSONObject("message")
                          .getString("content")
                  } catch (e: Exception) {
                      return "ERR: $e"
                  }
              }

              private fun handleBrain(result: String) {
                  orb.mode = if (listening) OrbView.Mode.LISTENING else OrbView.Mode.IDLE
                  if (result.startsWith("ERR:")) {
                      setStatus("Brain error:\n" + result.take(500))
                      addFeed("Mia", "Brain error. Check your key and model.")
                      return
                  }
                  val start = result.indexOf('{')
                  val end = result.lastIndexOf('}')
                  if (start < 0 || end <= start) {
                      say(result)
                      return
                  }
                  val j = try {
                      JSONObject(result.substring(start, end + 1))
                  } catch (e: Exception) {
                      say(result)
                      return
                  }
                  when (j.optString("action")) {
                      "call" -> callContact(j.optString("name"))
                      "open_app" -> openApp(j.optString("name"))
                      "flashlight" -> flashlight(j.optBoolean("on", true))
                      "volume" -> volume(j.optString("direction"))
                      "say" -> say(j.optString("text"))
                      else -> say(result)
                  }
              }

              private fun callContact(name: String) {
                  val number = findNumber(name)
                  if (number == null) {
                      setStatus("I couldn't find \"$name\" in your contacts.")
                      addFeed("Mia", "I couldn't find $name in your contacts.")
                      return
                  }
                  setStatus("Calling $name...")
                  addFeed("Mia", "Calling $name")
                  try {
                      val intent = Intent(Intent.ACTION_CALL, Uri.fromParts("tel", number, null))
                      startActivity(intent)
                  } catch (e: Exception) {
                      setStatus("Call error: $e")
                  }
              }

              private fun findNumber(name: String): String? {
                  val cursor = contentResolver.query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      arrayOf(ContactsContract.CommonDataKinds.Phone.NUMBER),
                      ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " LIKE ?",
                      arrayOf("%$name%"),
                      null
                  )
                  cursor?.use {
                      if (it.moveToFirst()) return it.getString(0)
                  }
                  return null
              }

              private fun openApp(name: String) {
                  if (name.isBlank()) {
                      say("Which app should I open?")
                      return
                  }
                  val pm = packageManager
                  val query = Intent(Intent.ACTION_MAIN)
                  query.addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(query, 0)
                  val target = apps.firstOrNull {
                      it.loadLabel(pm).toString().lowercase().contains(name.lowercase())
                  }
                  if (target == null) {
                      say("I couldn't find an app called $name.")
                      return
                  }
                  val launch = Intent(Intent.ACTION_MAIN)
                  launch.addCategory(Intent.CATEGORY_LAUNCHER)
                  launch.setClassName(target.activityInfo.packageName, target.activityInfo.name)
                  launch.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                  try {
                      startActivity(launch)
                      setStatus("Opening " + target.loadLabel(pm) + "...")
                      addFeed("Mia", "Opening " + target.loadLabel(pm))
                  } catch (e: Exception) {
                      setStatus("Open error: $e")
                  }
              }

              private fun flashlight(on: Boolean) {
                  try {
                      val cm = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      val id = cm.cameraIdList.firstOrNull {
                          cm.getCameraCharacteristics(it).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                      }
                      if (id == null) {
                          say("This phone has no flashlight.")
                          return
                      }
                      cm.setTorchMode(id, on)
                      setStatus(if (on) "Flashlight on" else "Flashlight off")
                  } catch (e: Exception) {
                      setStatus("Flashlight error: $e")
                  }
              }

              private fun volume(direction: String) {
                  val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val adj = when (direction) {
                      "up" -> AudioManager.ADJUST_RAISE
                      "down" -> AudioManager.ADJUST_LOWER
                      else -> AudioManager.ADJUST_MUTE
                  }
                  am.adjustStreamVolume(AudioManager.STREAM_MUSIC, adj, AudioManager.FLAG_SHOW_UI)
                  setStatus("Volume: $direction")
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacksAndMessages(null)
                  tts?.shutdown()
                  recognizer?.destroy()
              }
          }
          MIAEOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build the APK
        run: gradle assembleDebug --stacktrace

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: Mia-APK
          path: app/build/outputs/apk/debug/app-debug.apk
